<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>หน้าแรก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Noto+Serif+Thai:wght@400;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="home" class="theme-dark">
  <nav class="page-nav"><a class="text-link" href="welcome.html">← Go back</a></nav>

  <header class="details-hero">
    <h1><span data-bind="names.0"></span> <span class="amp">&amp;</span> <span data-bind="names.1"></span></h1>
    <p class="full-names" data-bind="fullNames"></p>
    <p class="date" data-bind="dateText"></p>
  </header>

  <section class="mail" aria-label="การ์ดเชิญ">
    <div class="mail-scene" style="aspect-ratio: 429 / 444">
      <img class="mail-card" src="images/mail/card.webp" alt="การ์ดชื่อ Pangkaew and Waratat" style="left:32.87%;top:0.00%;width:54.55%" />
      <img class="mail-photo" src="images/mail/photo.webp" alt="ภาพ Fang และ Frank" style="left:14.5%;top:12%;width:40.56%" />
      <img class="mail-envelope" src="images/mail/envelope.webp" alt="" style="left:17.95%;top:34.23%;width:69.46%" />
      <img class="mail-heart" src="images/mail/heart.webp" alt="Love The Date 28.11.2027" style="left:19.35%;top:36.71%;width:42.66%" />
      <img class="mail-ribbon" src="images/mail/ribbon.webp" alt="" style="left:47.32%;top:41.89%;width:38.23%" />
      <img class="mail-flowers-right" src="images/mail/flowers-right.webp" alt="" style="left:72.73%;top:20.50%;width:27.27%" />
      <img class="mail-flowers-left" src="images/mail/flowers-left.webp" alt="" style="left:0.00%;top:51.58%;width:26.81%" />
    </div>
  </section>

  <section class="celebrate" aria-label="นับถอยหลังถึงวันงาน">
    <p class="celebrate-title" data-bind="greeting"></p>
    <div class="countdown" id="countdown"></div>
  </section>

  <section class="player" id="player" aria-label="เพลงของเรา">
    <div class="player-art">
      <div class="vinyl" aria-hidden="true"><span class="vinyl-label"><img src="images/logo-fang-frank.svg" alt="" /></span></div>
      <div class="player-cover">
        <img class="player-cover-photo" src="images/cover-fang-frank.jpg" alt="Fang และ Frank กับน้องหมา" />
        <span class="player-cover-title" data-bind="music.title"></span>
      </div>
    </div>

    <div class="player-bar">
      <span class="player-time" id="player-current">00:00</span>
      <input class="player-seek" id="player-seek" type="range" min="0" max="100" step="1" value="0" aria-label="ตำแหน่งในเพลง" disabled />
      <span class="player-time" id="player-duration">--:--</span>
    </div>

    <div class="player-controls">
      <button class="player-btn" id="player-restart" type="button" aria-label="เริ่มเพลงใหม่" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
      </button>
      <button class="player-btn player-btn-main" id="player-toggle" type="button" aria-label="เล่นเพลง">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
      </button>
      <button class="player-btn" id="player-loop" type="button" aria-label="เล่นวน" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z" /></svg>
      </button>
    </div>
    <p class="player-status" id="player-status" role="status"></p>

    <!-- ตัวเล่น YouTube ที่ให้เสียง · ซ่อนไว้ ผู้ชมเห็นแต่แผ่นเสียง -->
    <div class="player-engine" aria-hidden="true"><div id="player-youtube"></div></div>
  </section>

  <nav class="home-links" aria-label="ไปหน้าอื่น">
    <a class="btn" href="details.html">The Details</a>
    <a class="btn" href="rsvp.html">Kindly RSVP</a>
  </nav>

  <footer>ขอบคุณที่ร่วมเป็นส่วนหนึ่งในวันสำคัญของเรา</footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="player.js"></script>
</body>
</html>
