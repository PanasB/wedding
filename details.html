<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>รายละเอียดงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Noto+Serif+Thai:wght@400;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="details">
  <nav class="page-nav"><a class="text-link" href="index.html">← Go back</a></nav>

  <header class="details-hero">
    <h1><span data-bind="names.0"></span> <span class="amp">&amp;</span> <span data-bind="names.1"></span></h1>
    <p class="full-names" data-bind="fullNames"></p>
    <p class="date" data-bind="dateText"></p>
  </header>

  <section class="celebrate" aria-label="นับถอยหลังถึงวันงาน">
    <p class="celebrate-title" data-bind="greeting"></p>
    <div class="countdown" id="countdown"></div>
  </section>

  <main>
    <section class="card" data-reveal id="schedule">
      <h2>กำหนดการ</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="card" data-reveal id="dress-code">
      <h2>Dress Code</h2>
      <ul class="swatches" id="swatches"></ul>
    </section>

    <section class="card" data-reveal id="venue">
      <h2>สถานที่</h2>
      <p class="venue-name" data-bind="venue.name"></p>
      <p class="muted" data-bind="venue.address"></p>
      <a class="btn btn-outline" id="map-link" target="_blank" rel="noopener">เปิดแผนที่</a>
    </section>

    <section class="cta" data-reveal>
      <a class="btn" href="rsvp.html">Kindly RSVP</a>
    </section>
  </main>

  <footer>ขอบคุณที่ร่วมเป็นส่วนหนึ่งในวันสำคัญของเรา</footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
